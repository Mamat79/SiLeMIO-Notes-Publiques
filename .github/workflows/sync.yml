name: Synchroniser les notes publiques
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-history
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Collecter les publications et conserver l’historique
        run: node sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Enregistrer seulement les changements
        run: |
          git add data history status
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualiser les notes publiques'
          git push
